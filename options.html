<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Focus Dashboard</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <div class="brand">
        <img src="icons/icon48.png" alt="" class="brand-icon">
        <div>
          <p class="eyebrow">Anti-Brain Rot Focus</p>
          <h1>Focus Dashboard</h1>
        </div>
      </div>
      <div class="focus-state" aria-live="polite">
        <span id="focusState">Loading</span>
        <small id="pauseStatus"></small>
      </div>
    </header>

    <section class="stats-grid" aria-label="Focus statistics">
      <article class="stat-card">
        <span class="label">Total Saves</span>
        <strong id="totalCount">0</strong>
        <small>redirected attempts</small>
      </article>
      <article class="stat-card">
        <span class="label">Blocked Sites</span>
        <strong id="blockedCount">0</strong>
        <small>domains and subdomains</small>
      </article>
      <article class="stat-card list-card">
        <div class="card-head">
          <span class="label">Top Distractions</span>
          <button id="resetStatsBtn" class="text-btn" type="button">Reset</button>
        </div>
        <ol id="topDistractions"></ol>
      </article>
    </section>

    <section class="section">
      <div class="section-header">
        <h2>Focus Controls</h2>
      </div>
      <div class="control-row">
        <label class="switch">
          <input type="checkbox" id="enabledToggle">
          <span class="switch-track" aria-hidden="true"></span>
          <span>Blocking enabled</span>
        </label>
        <button id="resumeFocusBtn" class="secondary-btn" type="button">Clear Pause</button>
      </div>
    </section>

    <section class="section">
      <div class="section-header">
        <h2>Blocked Page Message</h2>
      </div>
      <div class="form-group">
        <label for="motivationText">Message</label>
        <textarea id="motivationText" rows="4"></textarea>
        <div class="actions-row">
          <button id="saveTextBtn" class="primary-btn" type="button">Save Message</button>
          <span id="saveStatus" class="feedback" aria-live="polite"></span>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-header">
        <h2>Blocked Sites</h2>
      </div>
      <div class="form-group">
        <label for="newSite">Add a domain</label>
        <div class="add-site">
          <input type="text" id="newSite" placeholder="example.com">
          <button id="addSiteBtn" class="primary-btn" type="button">Add</button>
        </div>
        <p id="siteFeedback" class="feedback" aria-live="polite"></p>
        <div class="preset-row" aria-label="Preset blocklists">
          <button class="preset-btn" type="button" data-sites="youtube.com,tiktok.com,instagram.com,x.com,twitter.com,facebook.com,reddit.com">Social</button>
          <button class="preset-btn" type="button" data-sites="netflix.com,hulu.com,disneyplus.com,twitch.tv">Streaming</button>
          <button class="preset-btn" type="button" data-sites="amazon.com,ebay.com,etsy.com">Shopping</button>
        </div>
        <ul id="siteList" class="site-list"></ul>
      </div>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
