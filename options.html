<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Focus Dashboard</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>🧠 Anti-Brain Rot Dashboard</h1>
    
    <div class="section stats-section">
      <h2>Statistics</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total Saves</h3>
          <p id="totalCount">0</p>
          <small>Times you were redirected</small>
        </div>
        <div class="stat-card list-card">
          <h3>Top Distractions</h3>
          <ul id="topDistractions"></ul>
        </div>
      </div>
    </div>

    <div class="section settings-section">
      <h2>Settings</h2>
      
      <div class="form-group">
        <label>Motivational Text</label>
        <p class="hint">This is what you'll see instead of the blocked site.</p>
        <textarea id="motivationText" rows="4"></textarea>
        <button id="saveTextBtn">Save Text</button>
        <span id="saveStatus" style="display:none; color: green; margin-left: 10px;">Saved!</span>
      </div>

      <div class="form-group">
        <label>Blocked Sites</label>
        <div class="add-site">
          <input type="text" id="newSite" placeholder="example.com">
          <button id="addSiteBtn">Add Site</button>
        </div>
        <ul id="siteList" class="site-list"></ul>
      </div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
