<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 200px; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f9f9f9; }
    h2 { margin: 0 0 10px 0; font-size: 16px; color: #333; }
    button { padding: 10px 15px; margin-top: 10px; cursor: pointer; width: 100%; border: none; border-radius: 5px; font-weight: bold; transition: background 0.3s; }
    .status { margin-bottom: 15px; font-size: 14px; }
    .off { color: #d9534f; }
    .on { color: #5cb85c; }
    .link { display: block; margin-top: 15px; color: #666; text-decoration: none; font-size: 12px; transition: color 0.3s; }
    .link:hover { color: #000; text-decoration: underline; }
  </style>
</head>
<body>
  <h2>Anti-Brain Rot</h2>
  <div id="status" class="status">Loading...</div>
  <button id="toggleBtn">Toggle</button>
  <a href="#" id="optionsLink" class="link">⚙️ Dashboard & Settings</a>
  <script src="popup.js"></script>
</body>
</html>
