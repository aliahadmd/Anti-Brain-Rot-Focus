<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <img src="icons/icon48.png" alt="" class="logo">
    <div>
      <h1>Focus</h1>
      <p id="status" class="status">Loading...</p>
    </div>
  </header>

  <section class="snapshot" aria-label="Focus snapshot">
    <div>
      <span id="totalCount">0</span>
      <small>saves</small>
    </div>
    <div>
      <span id="siteCount">0</span>
      <small>blocked</small>
    </div>
  </section>

  <button id="toggleBtn" class="primary-btn" type="button">Toggle Focus</button>

  <div class="pause-row" aria-label="Pause focus">
    <button class="ghost-btn pause-btn" type="button" data-minutes="15">15m</button>
    <button class="ghost-btn pause-btn" type="button" data-minutes="60">1h</button>
    <button id="resumeBtn" class="ghost-btn" type="button">Resume</button>
  </div>

  <button id="optionsLink" class="link-btn" type="button">Dashboard & Settings</button>
  <script src="popup.js"></script>
</body>
</html>
